<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3ecf4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111a2c" media="(prefers-color-scheme: dark)">
<title>Yugantar 2026 · Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Two voices: Pixelify Sans is the fest's game world (title, place tags); Atkinson Hyperlegible Next is for reading in sun glare.
     Light or dark follows the phone: duty runs from 8 AM daylight to 10 PM. */
  :root {
    color-scheme: light dark;
    --sky: #e3ecf4; --window: #ffffff; --window-2: #f1f5f9; --ink: #15203a; --ink-soft: #4a5872;
    --line: #15203a; --line-soft: #c3cfdd; --press: #15203a; --focus: #1d4ed8;
    --gold: #ffcf3d; --on-gold: #15203a; --grass: #2f9e57; --brick: #c8402a; --warn: #8a5a00;
    --tint: #fff2c2; --tint-line: #15203a;                        /* "this is you / now" rows */
    --ease: cubic-bezier(.16, 1, .3, 1); --fast: 120ms; --base: 220ms;
    --pixel: "Pixelify Sans", system-ui, sans-serif;
    font: 400 100%/1.45 "Atkinson Hyperlegible Next", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --sky: #111a2c; --window: #1a2540; --window-2: #222f4f; --ink: #eef3fa; --ink-soft: #b4c1d6;
            --line: #6b7ea3; --line-soft: #33446a; --press: #070b14; --focus: #ffcf3d; --grass: #5fd48a; --brick: #ff7a5c; --warn: #ffcf3d;
            --tint: #26355c; --tint-line: #ffcf3d; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--sky); color: var(--ink); height: 100dvh; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr);
         overflow: hidden; -webkit-tap-highlight-color: transparent; caret-color: var(--ink); accent-color: var(--ink); scrollbar-color: var(--line-soft) transparent; }
  ::selection { background: var(--gold); color: var(--on-gold); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  time, .num { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; }
  p, li { text-wrap: pretty; }
  .icon { width: 1em; height: 1em; flex: none; fill: currentColor; shape-rendering: crispEdges; vertical-align: -.125em; }

  /* pixel controls: flat window, 2px frame, a key that presses down */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px;
         background: var(--window); border: 2px solid var(--line); border-radius: 0; box-shadow: 0 3px 0 var(--press); font-weight: 700; }
  .btn:active { translate: 0 3px; box-shadow: none; }
  .btn.primary { background: var(--gold); color: var(--on-gold); border-color: #15203a; }
  @media (prefers-reduced-motion: no-preference) { .btn { transition: translate var(--fast) var(--ease), box-shadow var(--fast) var(--ease); } }

  .top { display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 12px 6px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-right: auto; min-width: 0; }
  .logo { width: 30px; height: 30px; display: grid; place-items: center; font: 700 1.125rem var(--pixel);
          background: var(--gold); color: var(--on-gold); border: 2px solid #15203a; flex: none; }
  .brand h1 { margin: 0; font: 700 1.125rem/1.1 var(--pixel); white-space: nowrap; }
  .brand p { margin: 0; color: var(--ink-soft); font-size: .75rem; }
  .pill { font-size: .75rem; padding: 3px 8px; border: 2px solid var(--line-soft); color: var(--ink-soft); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .pill::before { content: ""; width: 8px; height: 8px; background: var(--warn); }
  .pill.live::before { background: var(--grass); }

  .when { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 2px 12px 8px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1 1 auto; min-height: 44px; padding: 5px 8px; text-align: left; line-height: 1.15; white-space: nowrap;
                background: var(--window); border: 2px solid var(--line-soft); border-radius: 0; font-size: clamp(.8125rem, 3.7vw, .9375rem); }
  .seg button small { display: block; color: var(--ink-soft); font-size: .75rem; }
  .seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: #15203a; box-shadow: 0 3px 0 var(--press); }
  .seg button[aria-pressed="true"] small { color: var(--on-gold); }
  .nowtag { font: 700 .6875rem var(--pixel); background: var(--ink); color: var(--window); padding: 0 4px; margin-left: 5px; vertical-align: 1px; }
  .seg button[aria-pressed="true"] .nowtag { background: #15203a; color: #ffcf3d; }

  main { position: relative; min-height: 0; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; background: #7bb6e3; }
  #stage:focus-visible { outline-offset: -3px; }
  #world { position: absolute; inset: 0; }                       /* what pinch and drag move */
  #map { position: absolute; }                                   /* the campus picture, fitted inside the stage */
  #map img { display: block; width: 100%; height: 100%; image-rendering: pixelated; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #night { position: absolute; inset: 0; background: #0b1a52; mix-blend-mode: multiply; opacity: 0; pointer-events: none; }
  #map.night #night { opacity: .72; }                            /* the Evening shift shows the campus at night */
  @media (prefers-reduced-motion: no-preference) { #night { transition: opacity 400ms var(--ease); } }
  #zones { position: absolute; inset: 0; width: 100%; height: 100%; }
  .zone { fill: var(--c); fill-opacity: .24; stroke: var(--c); stroke-width: 3; vector-effect: non-scaling-stroke; cursor: pointer; }
  .zone.sel { fill-opacity: .48; stroke-width: 4; }
  .zone.off { display: none; }
  #pins { position: absolute; inset: 0; pointer-events: none; }
  .lbl, .mark { position: absolute; transform-origin: 50% 100%;
                transform: translate(-50%, -100%) scale(var(--inv, 1)) translate(var(--dx, 0px), var(--dy, 0px)); }  /* same size at any zoom */
  .lbl { pointer-events: auto; z-index: 1; padding: 3px 7px; width: max-content; max-width: 150px; text-align: center; cursor: pointer;  /* not squeezed by the map edge */
         background: var(--window); color: var(--ink); border: 2px solid var(--c); border-radius: 0; box-shadow: 0 2px 0 var(--press); }
  .lbl span { display: block; font: 500 .6875rem/1.2 var(--pixel); }
  .lbl span::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 4px; background: var(--c); }
  .lbl b { display: block; font-size: .8125rem; line-height: 1.2; }
  #stage.short .lbl { padding: 2px 5px; max-width: 128px; }
  @media (max-width: 380px) { .logo { display: none; } .seg { gap: 4px; } .seg button { padding-inline: 6px; } }
  #stage.short .lbl b { font-size: .75rem; }
  .lbl.sel { outline: 3px solid var(--gold); outline-offset: 0; }
  .lbl.away { visibility: hidden; }                              /* its place is off screen and there's no room for it */
  .quest { position: absolute; z-index: 2; pointer-events: none; transform: translate(-50%, calc(-100% - 3px)); }
  #stage.short .quest { transform: translate(-50%, calc(-100% + 2px)); }   /* short maps: the marker rests on the tag's 2px frame, clear of its text */
  #stage.short .quest span { padding: 1px 4px; }
  #stage.short .quest span::after { display: none; }
  .quest span { display: block; font: 700 .6875rem/1 var(--pixel); padding: 3px 5px; background: var(--gold); color: var(--on-gold); border: 2px solid #15203a; white-space: nowrap; }
  .quest span::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 6px; translate: -50% 0; background: #15203a;
                       clip-path: polygon(0 0, 100% 0, 50% 100%); }
  @media (prefers-reduced-motion: no-preference) { .quest span.bob { animation: bob .36s step-end 3; } }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .mark { display: none; font: 500 .6875rem var(--pixel); padding: 2px 5px; white-space: nowrap; background: #b33a24; color: #fff; border: 2px solid #15203a; }  /* white text needs the dark brick in both themes */
  .mark .icon { margin-right: 3px; }
  #stage.marks .mark { display: block; }                         /* the closed-areas button shows them */
  .mapbtns { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }  /* the campus's top-left corner has no posts */
  .mapbtn { width: 44px; padding: 0; font-size: 1.25rem; }
  #zoomIn, #zoomOut { display: none; }
  @media (min-width: 900px) { #zoomIn, #zoomOut { display: inline-flex; } }   /* phones zoom by pinching or tapping a place */
  #marksBtn[aria-pressed="true"] { background: #b33a24; color: #fff; }

  .sheet { flex: none; max-height: 40dvh; display: flex; flex-direction: column; view-transition-name: sheet;
           background: var(--window); border-top: 2px solid var(--line); padding: 0 14px calc(12px + env(safe-area-inset-bottom)); }
  .sheet.open { max-height: 80dvh; }
  ::view-transition-group(sheet) { animation-duration: 260ms; animation-timing-function: var(--ease); }
  .grip { align-self: center; width: 88px; height: 44px; margin-bottom: -10px; border: 0; background: none; flex: none; }
  .grip::before { content: ""; display: block; margin: auto; width: 40px; height: 6px; background: var(--line-soft); }
  .sheet-body { overflow-y: auto; overscroll-behavior: contain; padding-top: 6px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; min-height: 44px; background: var(--window); border: 2px solid var(--line-soft); border-radius: 0; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--window); border-color: var(--ink); font-weight: 700; }
  h2 { margin: 2px 0 2px; font: 700 1.375rem/1.2 var(--pixel); }
  h3 { margin: 18px 0 6px; font-size: 1.125rem; font-weight: 700; }
  .sub { color: var(--ink-soft); font-size: .875rem; margin: 0 0 8px; }
  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .row { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; min-height: 52px; padding: 8px 12px;
         background: var(--window); border: 2px solid var(--line-soft); border-radius: 0; }
  .dot { width: 12px; height: 12px; background: var(--c); border: 2px solid #15203a; flex: none; }
  .row .grow { flex: 1; min-width: 0; }
  .row small { display: block; color: var(--ink-soft); font-size: .8125rem; }
  .row.now { border-color: var(--tint-line); background: var(--tint); }
  .chip { display: inline-block; border: 2px solid var(--line-soft); padding: 4px 10px; margin: 0 6px 6px 0; font-size: .875rem; }
  .ev { display: grid; grid-template-columns: 96px 1fr; gap: 8px; font-size: .875rem; padding: 7px 0; border-bottom: 2px solid var(--window-2); }
  .ev time { color: var(--ink-soft); }
  .back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0 2px; min-height: 44px; font-weight: 700; }
  .swapbtn { min-height: 44px; padding: 0 12px; font-size: .875rem; }
  .rowlink { flex: 1; min-width: 0; min-height: 44px; padding: 0; background: none; border: 0; text-align: left; cursor: pointer; }
  .placeh { display: flex; align-items: center; gap: 8px; }
  .bullets { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .bigselect { width: 100%; min-height: 48px; padding: 0 12px; background: var(--window); border: 2px solid var(--line); border-radius: 0; }
  .muted { color: var(--ink-soft); }
  .intro { border: 2px solid var(--tint-line); background: var(--tint); padding: 12px 14px; margin-bottom: 12px; }
  .intro h2 { font-size: 1.0625rem; margin-bottom: 6px; }
  .intro ol { margin: 0 0 12px; padding-left: 20px; display: grid; gap: 4px; font-size: .9375rem; }

  dialog { border: 2px solid var(--line); border-radius: 0; background: var(--window); color: var(--ink); box-shadow: 0 4px 0 var(--press);
           width: min(94vw, 460px); max-height: 88dvh; padding: 18px; }
  dialog:modal { overscroll-behavior: contain; }
  dialog::backdrop { background: rgba(10, 16, 30, .62); overflow: hidden; overscroll-behavior: contain; }
  dialog h2 { margin-top: 0; }
  #swapForm { display: flex; flex-direction: column; max-height: calc(88dvh - 40px); }
  #swapForm p { margin: 4px 0; }
  #swapWith { display: grid; gap: 6px; flex: 1 1 auto; min-height: 120px; overflow-y: auto; overscroll-behavior: contain; align-content: start; margin: 6px 0; }
  .opt { display: flex; gap: 10px; align-items: center; border: 2px solid var(--line-soft); padding: 8px 10px; min-height: 48px; }
  .opt input { width: 20px; height: 20px; margin: 0; }
  .opt:has(input:checked) { border-color: var(--tint-line); background: var(--tint); }
  .opt:has(input:disabled) { opacity: .45; }
  .field { display: grid; gap: 6px; margin: 10px 0; font-weight: 700; }
  .field input { min-height: 48px; border: 2px solid var(--line); border-radius: 0; background: var(--window-2); padding: 0 12px; font-weight: 400; letter-spacing: .08em; }
  .field input[aria-invalid="true"] { border-color: var(--brick); }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .alert { color: var(--brick); min-height: 1.3em; font-size: .9375rem; font-weight: 700; }
  .note { color: var(--warn); font-size: .875rem; }
  .toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); translate: -50% -8px; z-index: 5; max-width: min(92vw, 420px);
           background: var(--window); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--press); padding: 10px 14px; opacity: 0; pointer-events: none; }
  .toast.show { opacity: 1; translate: -50% 0; }
  @media (prefers-reduced-motion: no-preference) { .toast { transition: opacity var(--base) var(--ease), translate var(--base) var(--ease); } }
  @media (prefers-reduced-motion: reduce) { .toast { translate: -50% 0; transition: opacity var(--base); } }
  ol.rules { padding-left: 22px; display: grid; gap: 8px; }

  @media (min-width: 900px), (orientation: landscape) and (max-height: 560px) {
    main { display: grid; grid-template-columns: 1fr 400px; grid-template-rows: minmax(0, 1fr); }  /* the panel scrolls; it never stretches the map */
    .sheet { max-height: none; border-top: 0; border-left: 2px solid var(--line); padding-top: 14px; }
    .grip { display: none; }
  }
  @media (orientation: landscape) and (max-height: 560px) {  /* phones held sideways: one row of tabs, map beside the panel */
    body { padding-inline: env(safe-area-inset-left) env(safe-area-inset-right); }
    main { grid-template-columns: 1fr min(42vw, 360px); }
    .top { padding-block: 4px 2px; }
    .when { grid-template-columns: auto minmax(0, 1fr); padding-bottom: 6px; }
    .seg button { min-height: 40px; padding: 4px 10px; }
    .seg button small { display: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-fit" viewBox="0 0 12 12"><path d="M0 0h4v2H2v2H0zM8 0h4v4h-2V2H8zM0 8h2v2h2v2H0zM10 8h2v4H8v-2h2z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 12 12"><path fill-rule="evenodd" d="M4 0h4v1h2v1h1v2h1v4h-1v2h-1v1H8v1H4v-1H2v-1H1V8H0V4h1V2h1V1h2zM2 5v2h8V5z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 12 12"><path d="M5 1h2v4h4v2H7v4H5V7H1V5h4z"/></symbol>
  <symbol id="i-minus" viewBox="0 0 12 12"><path d="M1 5h10v2H1z"/></symbol>
  <symbol id="i-back" viewBox="0 0 12 12"><path d="M7 1h2v2H7zM5 3h2v2H5zM3 5h2v2H3zM5 7h2v2H5zM7 9h2v2H7z"/></symbol>
  <symbol id="i-next" viewBox="0 0 12 12"><path d="M3 1h2v2H3zM5 3h2v2H5zM7 5h2v2H7zM5 7h2v2H5zM3 9h2v2H3z"/></symbol>
  <symbol id="i-x" viewBox="0 0 10 10"><path d="M0 0h2v2H0zM2 2h2v2H2zM4 4h2v2H4zM6 6h2v2H6zM8 8h2v2H8zM8 0h2v2H8zM6 2h2v2H6zM2 6h2v2H2zM0 8h2v2H0z"/></symbol>

</svg>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">Y</span><div><h1>Yugantar '26</h1><p>Security duty map</p></div></div>
  <span id="sync" class="pill">Connecting…</span>
  <button id="rulesBtn" class="btn" type="button">Rules</button>
</header>
<nav class="when" aria-label="Day and time">
  <div class="seg" id="days" role="group" aria-label="Day"></div>
  <div class="seg" id="times" role="group" aria-label="Time"></div>
</nav>
<main>
  <div id="stage" role="region" tabindex="0" aria-label="Campus map" aria-describedby="mapHelp">

function swapProblem(roster, block, a, b) {

  if (r[a] === PLAN.rest || r[b] === PLAN.rest) return "A resting team can't swap.";

function apply(s) {
  if (!s || !s.roster) return;
  let changed = JSON.stringify([s.roster, s.problems]) !== JSON.stringify([state.roster, state.problems]) || (s.swaps || []).length !== state.swaps.length;
  state.teams = s.teams || Object.keys(s.roster[PLAN.blocks[0]] || {});
  state.roster = s.roster; state.swaps = s.swaps || []; state.problems = s.problems || []; state.live = live;
  if (state.team && !state.teams.includes(state.team)) { state.team = ""; localStorage.removeItem("yug26-team"); changed = true; }
  state.synced = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: true });
  if (changed) render();
  else showSync();
}
let swapsDone = 0;  // a read that started before a swap landed can't put the old places back
const sync = () => { const seen = swapsDone; return api.get().then((s) => seen === swapsDone && apply(s)).catch(() => { state.live = false; showSync(); }); };
if (live) { setInterval(sync, 20000); document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && sync()); }

// ---- today's fest day and the block happening now; the app opens on it (after 10 PM: that day's Evening)
function festNow() {
  const now = new Date(), today = [now.getFullYear(), now.getMonth() + 1, now.getDate()].map((n) => String(n).padStart(2, "0")).join("-");
  const d = Object.keys(PLAN.days).find((k) => PLAN.dates[k] === today);
  const m = now.getHours() * 60 + now.getMinutes();
  return { d, t: d && Object.keys(PLAN.times).find((k) => m < PLAN.times[k].window[1]) };
}
function nowBlock() { const { d, t } = festNow(); return t ? block(d, t) : null; }
const opening = festNow();
if (opening.d) { state.day = opening.d; state.time = opening.t || "Evening"; }

// ---- pixel map: the fest's campus picture, each place outlined, Team Lead tags on top
const MAP_W = 1536, MAP_H = 768, SVGNS = "http://www.w3.org/2000/svg";
const stage = $("stage"), world = $("world"), mapEl = $("map");
const at = ([x, y]) => ({ left: `${(x / MAP_W) * 100}%`, top: `${(y / MAP_H) * 100}%` });
const tags = {};
for (const [name, polys] of Object.entries(PLAN.areas)) {
  const g = document.createElementNS(SVGNS, "g");
  g.setAttribute("class", "zone");
  g.style.setProperty("--c", colour(name));
  g.dataset.place = name;
  for (const poly of polys) {
    const p = document.createElementNS(SVGNS, "polygon");
    p.setAttribute("points", poly.map((q) => q.join(",")).join(" "));
    g.appendChild(p);
  }
  $("zones").appendChild(g);
  const el = document.createElement("button");
  el.type = "button";
  el.className = "lbl panzoom-exclude";
  el.style.setProperty("--c", colour(name));
  Object.assign(el.style, at(PLAN.places[name].at));
  el.addEventListener("click", () => selectPlace(name));
  $("pins").appendChild(el);
  tags[name] = { g, el };
}
const marks = PLAN.marks.map(([x, y, text, kind, when]) => {
  const el = document.createElement("div");
  el.className = `mark ${kind}`;
  el.innerHTML = kind === "closed" ? `${icon("x")}${esc(text)}` : esc(text);
  Object.assign(el.style, at([x, y]));
  $("pins").appendChild(el);
  return { el, when };
});

// Your team's quest marker: it sits on your team's tag and flies to the next post when the shift or a swap changes it.
const quest = $("quest"), questLabel = quest.firstElementChild;
let questFrom = null, questPlace, questFly = false;
function bob() { questLabel.classList.remove("bob"); void questLabel.offsetWidth; questLabel.classList.add("bob"); }
function placeQuest() {
  const mine = Object.values(tags).find((t) => !t.el.hidden && t.el.classList.contains("mine") && !t.el.classList.contains("away"));
  const s = stage.getBoundingClientRect(), r = mine?.el.getBoundingClientRect();
  if (!r || r.top < s.top || r.bottom > s.bottom + 2 || r.right < s.left || r.left > s.right) { quest.hidden = true; questFrom = null; return; }  // tag not fully in view
  const x = r.left + r.width / 2 - s.left, y = r.top - s.top;
  quest.hidden = false;
  Object.assign(quest.style, { left: `${x}px`, top: `${y}px` });
  if (questFly) {
    quest.getAnimations().forEach((a) => a.cancel());
    if (questFrom && !reduced.matches) {
      quest.animate([{ translate: `${questFrom.x - x}px ${questFrom.y - y}px` }, { translate: "0 0" }],
                    { duration: 600, easing: "cubic-bezier(.16, 1, .3, 1)" }).finished.then(bob, () => {});
    } else bob();
    questFly = false;
  }
  questFrom = { x, y };
}

function updateMap() {
  const now = new Set(placesNow()), b = block(), mine = state.team && state.roster[b]?.[state.team];
  for (const [name, { g, el }] of Object.entries(tags)) {
    const on = now.has(name);
    g.classList.toggle("off", !on);
    g.classList.toggle("sel", state.place === name);
    el.hidden = !on;
    el.innerHTML = `<span>${esc(name)}</span><b>${teamsAt(name).map((t) => esc(short(t))).join(", ")}</b>`;
    el.classList.toggle("sel", state.place === name);
    el.classList.toggle("mine", mine === name);
  }
  if (mine !== questPlace) { questFly = true; questPlace = mine; }
  mapEl.classList.toggle("night", state.time === "Evening");
  for (const m of marks) m.el.hidden = (m.when === "D1D2" && state.day === "D3") || (m.when === "notD3E" && b === "D3 Evening");
  requestAnimationFrame(declutter);
}

// Keep tags readable: nudge a tag that sticks out past the map edge back in, then move any tag that would cover the
// map buttons or another tag to the nearest free spot above or below, preferring spots inside the map area.
// (About 10 tags; the nearest free spot is always the tag's own spot or touching an edge of something already placed.)
function declutter() {
  const els = Object.values(tags).map((t) => t.el).filter((el) => !el.hidden), s = stage.getBoundingClientRect();
  els.forEach((el) => { el.style.setProperty("--dx", "0px"); el.style.setProperty("--dy", "0px"); el.classList.remove("away"); });
  const b = document.querySelector(".mapbtns").getBoundingClientRect();
  const placed = [{ left: b.left - 3, right: b.right + 3, top: b.top - 3, bottom: b.bottom }];
  for (const [el, r] of els.map((el) => [el, el.getBoundingClientRect()]).sort((a, c) => a[1].top - c[1].top)) {
    if (r.bottom < s.top || r.top > s.bottom || r.right < s.left || r.left > s.right) continue;  // off screen: leave it be
    const dx0 = Math.max(0, s.left + 4 - r.left) - Math.max(0, r.right - s.right + 4);  // partly off the side: nudge in
    const badge = el.classList.contains("mine") ? (stage.classList.contains("short") ? 16 : 24) : 0;  // room for the quest marker above your team's tag
    const w = r.width, h = r.height + badge, from = r.top - badge;
    const box = (dx, top) => ({ dx, top, left: r.left + dx, right: r.right + dx, bottom: top + h });
    const hits = (c) => placed.filter((p) => c.left < p.right && c.right > p.left && c.top < p.bottom && c.bottom > p.top);
    const inside = (c) => c.top >= s.top && c.bottom <= s.bottom && c.left >= s.left + 2 && c.right <= s.right - 2;
    // Candidates: its own spot, or touching an edge of whatever it would cover: above, below, or beside it (beside stays near the place).
    const start = box(dx0, from), cands = [start];
    for (const p of hits(start)) {
      cands.push(box(dx0, p.bottom + 3), box(dx0, p.top - 3 - h));
      for (const dx of [p.right + 3 - r.left, p.left - 3 - r.right]) if (Math.abs(dx) <= w * .75) cands.push(box(dx, from));
    }
    for (const p of placed) if (p.left < start.right && p.right > start.left) cands.push(box(dx0, p.bottom + 3), box(dx0, p.top - 3 - h));
    const best = cands.filter((c) => !hits(c).length)
      .sort((a, c) => inside(c) - inside(a) || (Math.abs(a.dx - dx0) + Math.abs(a.top - from)) - (Math.abs(c.dx - dx0) + Math.abs(c.top - from)))[0] || start;
    const ax = (r.left + r.right) / 2, placeOnScreen = ax >= s.left && ax <= s.right && r.bottom >= s.top && r.bottom <= s.bottom;
    if (!inside(best) && !placeOnScreen) { el.classList.add("away"); continue; }
    if (best.dx) el.style.setProperty("--dx", `${best.dx}px`);
    if (best.top !== from) el.style.setProperty("--dy", `${best.top - from}px`);
    placed.push(best);
  }
  placeQuest();
}

// The picture is fitted inside the map area; pinch/drag (Panzoom) moves the whole #world, drawn as scale(s) translate(t) around its centre.
let fit = { k: 1, x: 0, y: 0 }, pz = null, userMoved = false;
function layout() {
  const w = stage.clientWidth, h = stage.clientHeight, k = Math.min(w / MAP_W, h / MAP_H);
  fit = { k, x: (w - MAP_W * k) / 2, y: (h - MAP_H * k) / 2 };
  Object.assign(mapEl.style, { width: `${MAP_W * k}px`, height: `${MAP_H * k}px`, left: `${fit.x}px`, top: `${fit.y}px` });
  stage.classList.toggle("short", h < 330);  // small phones and phones held sideways: smaller tags
}
// Once the zoomed picture is bigger than the map area its edges stay outside (no empty band); while smaller it stays centred.
function clampAxis(t, S, M, s, off) {  // S: map area size, M: picture size at zoom 1, off: picture offset in the world
  const lo = (S / 2 - M * s) / s + S / 2 - off, hi = -S / 2 / s + S / 2 - off;  // picture's near edge between S - M·s and 0
  return M * s >= S ? Math.min(Math.max(t, lo), hi) : (lo + hi) / 2;
}
const clamp = (x, y, s) => [clampAxis(x, stage.clientWidth, MAP_W * fit.k, s, fit.x), clampAxis(y, stage.clientHeight, MAP_H * fit.k, s, fit.y)];
function centreOn([x, y], scale, animate) {
  if (!pz) return;
  const [tx, ty] = clamp(stage.clientWidth / 2 - (fit.x + x * fit.k), stage.clientHeight / 2 - (fit.y + y * fit.k), scale);
  pz.zoom(scale, { animate });
  pz.pan(tx, ty, { animate });
}
function startView() {  // phones: fill the map area's height, centred between Gate 6 and the OAT; wide screens: whole campus
  const fill = stage.clientHeight / (MAP_H * fit.k);
  if (fill > 1.15) centreOn([700, 400], Math.min(fill, 3), false);
  else pz?.reset({ animate: false });
}
function focusPlace(name) {
  const p = PLAN.places[name]?.at;
  if (!p || !pz) return;
  userMoved = true;
  centreOn(p, Math.max(pz.getScale(), innerHeight > innerWidth ? 2.6 : 2), !reduced.matches);
}
let down = null;  // a tap (not a drag) on an outlined area selects that place
stage.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; }, true);
stage.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6 || e.target.closest("button")) return;
  const zone = document.elementsFromPoint(e.clientX, e.clientY).map((el) => el.closest?.(".zone")).find(Boolean);
  if (zone) selectPlace(zone.dataset.place);
}, true);
new ResizeObserver(() => { layout(); if (!userMoved) startView(); requestAnimationFrame(declutter); }).observe(stage);
document.fonts.addEventListener("loadingdone", () => requestAnimationFrame(declutter));  // tags change size when the web fonts arrive
document.addEventListener("app:update", updateMap);
document.addEventListener("app:focus", (e) => focusPlace(e.detail));
$("marksBtn").onclick = () => $("marksBtn").setAttribute("aria-pressed", stage.classList.toggle("marks"));
// The map without a mouse or a drag: arrow keys move it, + and - zoom, 0 shows the whole campus.
stage.addEventListener("keydown", (e) => {
  if (e.target !== stage || !pz || e.metaKey || e.ctrlKey || e.altKey) return;
  const s = pz.getScale(), animate = !reduced.matches;
  const move = { ArrowLeft: [80, 0], ArrowRight: [-80, 0], ArrowUp: [0, 80], ArrowDown: [0, -80] }[e.key];
  if (move) pz.pan(move[0] / s, move[1] / s, { relative: true, animate });
  else if (e.key === "+" || e.key === "=") pz.zoomIn({ animate });
  else if (e.key === "-") pz.zoomOut({ animate });
  else if (e.key === "0") pz.reset({ animate });
  else return;
  userMoved = true;
  e.preventDefault();
});
import("https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.6.2/dist/panzoom.es.js").catch(() => null).then((m) => {
  if (!m) return;  // no internet for the zoom library: the map still shows, just without zoom
  // Panzoom paints each move a frame later with the unclamped position, so clamp at paint time: no frame shows an empty band.
  pz = m.default(world, { minScale: 1, maxScale: 6, excludeClass: "panzoom-exclude", cursor: "grab",
    setTransform: (el, { x, y, scale }) => { const [cx, cy] = clamp(x, y, scale); el.style.transform = `scale(${scale}) translate(${cx}px, ${cy}px)`; } });
  const animate = () => !reduced.matches;
  stage.addEventListener("wheel", (e) => { userMoved = true; pz.zoomWithWheel(e); }, { passive: false });
  world.addEventListener("panzoomstart", () => { userMoved = true; });
  world.addEventListener("transitionend", () => requestAnimationFrame(declutter));  // animated moves report their end position before they get there
  world.addEventListener("panzoomchange", (e) => {
    const { x, y, scale } = e.detail, [cx, cy] = clamp(x, y, scale);  // keep the stored position in line with what's painted
    if (Math.abs(cx - x) > 0.5 || Math.abs(cy - y) > 0.5) pz.pan(cx, cy, { silent: true, animate: false });
    world.style.setProperty("--inv", 1 / scale);
    requestAnimationFrame(declutter);
  });
  $("zoomAll").onclick = () => { userMoved = true; pz.reset({ animate: animate() }); };
  $("zoomIn").onclick = () => { userMoved = true; pz.zoomIn({ animate: animate() }); };
  $("zoomOut").onclick = () => { userMoved = true; pz.zoomOut({ animate: animate() }); };
  for (const id of ["zoomAll", "zoomIn", "zoomOut"]) $(id).hidden = false;
  layout();
  startView();
});

render();
sync();
</script>
</body>
</html>
