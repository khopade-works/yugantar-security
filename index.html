<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3ecf4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111a2c" media="(prefers-color-scheme: dark)">
<title>Yugantar 2026 · Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.68b42ec4d7cf.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-fit" viewBox="0 0 12 12"><path d="M0 0h4v2H2v2H0zM8 0h4v4h-2V2H8zM0 8h2v2h2v2H0zM10 8h2v4H8v-2h2z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 12 12"><path fill-rule="evenodd" d="M4 0h4v1h2v1h1v2h1v4h-1v2h-1v1H8v1H4v-1H2v-1H1V8H0V4h1V2h1V1h2zM2 5v2h8V5z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 12 12"><path d="M5 1h2v4h4v2H7v4H5V7H1V5h4z"/></symbol>
  <symbol id="i-minus" viewBox="0 0 12 12"><path d="M1 5h10v2H1z"/></symbol>
  <symbol id="i-back" viewBox="0 0 12 12"><path d="M7 1h2v2H7zM5 3h2v2H5zM3 5h2v2H3zM5 7h2v2H5zM7 9h2v2H7z"/></symbol>
  <symbol id="i-next" viewBox="0 0 12 12"><path d="M3 1h2v2H3zM5 3h2v2H5zM7 5h2v2H7zM5 7h2v2H5zM3 9h2v2H3z"/></symbol>
  <symbol id="i-x" viewBox="0 0 10 10"><path d="M0 0h2v2H0zM2 2h2v2H2zM4 4h2v2H4zM6 6h2v2H6zM8 8h2v2H8zM8 0h2v2H8zM6 2h2v2H6zM2 6h2v2H2zM0 8h2v2H0z"/></symbol>
  <symbol id="i-swap" viewBox="0 0 12 12"><path d="M0 2h8v2H0zM8 0h1v6H8zM9 1h1v4H9zM10 2h1v2h-1zM4 8h8v2H4zM3 6h1v6H3zM2 7h1v4H2zM1 8h1v2H1z"/></symbol>
</svg>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">Y</span><div><h1>Yugantar '26</h1><p>Security duty map</p></div></div>
  <span id="sync" class="pill">Connecting…</span>
  <button id="rulesBtn" class="btn" type="button">Rules</button>
</header>
<nav class="when" aria-label="Day and time">
  <div class="seg" id="days" role="group" aria-label="Day"></div>
  <div class="seg" id="times" role="group" aria-label="Time"></div>
</nav>
<main>
  <div id="stage" role="region" tabindex="0" aria-label="Campus map" aria-describedby="mapHelp">
    <p id="mapHelp" class="vh">Tap a place to see who is there. Pinch or press plus and minus to zoom, drag or use the arrow keys to move, press 0 for the whole campus.</p>
    <div id="world"><div id="map">
      <img src="campus_pixel.847b63d7b9fb.webp" alt="Yugantar 2026 campus map" width="1536" height="768">
      <div class="edge" id="edgeT"></div><div class="edge" id="edgeB"></div><div class="edge" id="edgeL"></div><div class="edge" id="edgeR"></div>
      <div id="night"></div>
      <svg id="zones" viewBox="0 0 1536 768" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="pins"></div>
    </div></div>
    <div class="quest" id="quest" aria-hidden="true" hidden><span>Your team</span></div>
    <div class="mapbtns" role="toolbar" aria-label="Map">
      <button class="btn mapbtn" id="zoomAll" type="button" aria-label="Show the whole campus" title="Whole campus" hidden><svg class="icon"><use href="#i-fit"/></svg></button>
      <button class="btn mapbtn" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in" hidden><svg class="icon"><use href="#i-plus"/></svg></button>
      <button class="btn mapbtn" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out" hidden><svg class="icon"><use href="#i-minus"/></svg></button>
      <button class="btn mapbtn" id="marksBtn" type="button" aria-pressed="false" aria-label="Show closed and off-limits areas" title="Closed and off-limits areas"><svg class="icon"><use href="#i-stop"/></svg></button>
    </div>
  </div>
  <section id="sheet" class="sheet" aria-label="Details">
    <button class="grip" id="grip" type="button" aria-label="Show more" aria-expanded="false"></button>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</main>

<dialog id="swapDlg" closedby="any" aria-labelledby="swapTitle">
  <form method="dialog" id="swapForm">
    <h2 id="swapTitle">Swap places</h2>
    <p id="swapWhen" class="sub"></p>
    <p id="swapYou"></p>
    <p id="swapWithLabel" class="sub">Swap with (talk to that Team Lead first)</p>
    <div id="swapWith" role="radiogroup" aria-labelledby="swapWithLabel"></div>
    <p id="swapPreview"></p>
    <p id="swapWarn" class="note"></p>
    <label class="field" id="codeRow">Team code (ask your HoD)
      <input name="code" id="swapCode" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="swapErr">
    </label>
    <p id="swapErr" class="alert" role="alert"></p>
    <div class="actions">
      <button class="btn" value="cancel" formnovalidate autofocus>Cancel</button>
      <button class="btn primary" value="swap" id="swapGo"><svg class="icon" aria-hidden="true"><use href="#i-swap"/></svg>Swap</button>
    </div>
  </form>
</dialog>

<dialog id="rulesDlg" closedby="any" aria-labelledby="rulesTitle">
  <h2 id="rulesTitle">Security rules</h2>
  <ol class="rules" id="rulesList"></ol>
  <p id="oncall" class="muted"></p>
  <form method="dialog" class="actions"><button class="btn primary" autofocus>Got it</button></form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="config.3c7ea6128c7d.js"></script>
<script src="app.7593fc392938.js"></script>
<script src="map.fb09e161c7b0.js"></script>
</body>
</html>
